# Nixpacks configuration for Railway

[providers]
providers = ["node"]

[variables]
PORT = "3000"
NODE_ENV = "production"

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npx next start -H 0.0.0.0 -p ${PORT:-3000}"
